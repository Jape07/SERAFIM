name: publish

# Builds real gold with `python -m serafim run` (bronze, silver, gold for settings.publish),
# checks it with validate_gold() and deploys the site with it. If any step fails, nothing is
# deployed and the site keeps the previous version.
#
# Bronze (~4.4 MB per frame) and the catalog cache are kept in the Actions cache, so a run only
# downloads frames it does not have yet. The first run of a target downloads all its frames
# (Barnard: ~9 minutes with IRSA's 503s; the 5 targets: ~1 hour).
#
# Weekly ingest (task D10): every Monday the run asks IRSA's search again (--refresh-search)
# instead of reusing its cached answer, so new frames and new seasons reach the site. If IRSA
# does not answer, the last answer is used and the site stays as it was. Run it by hand with
# "refresh" when IRSA comes back. GitHub pauses schedules after 60 days without commits.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the site (false: only build and check gold, e.g. from a branch)"
        type: boolean
        default: true
      refresh:
        description: "Ask IRSA's search again for new frames and seasons, like the weekly run"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# A new run of the same branch waits for the one in progress instead of cancelling it (cancelling
# a long first download would throw away its work), and runs of other branches never touch it.
# Only the deploy job shares the "pages" group, so two deploys never overlap.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .

      - name: Restore bronze and the catalog cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bronze
            data/catalog_cache
          key: bronze-never-an-exact-match
          restore-keys: bronze-

      - name: Pipeline (bronze, silver, gold)
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python -m serafim run --refresh-search
          else
            python -m serafim run
          fi

      # Saved even if the pipeline failed or the run was cancelled, so a long download is never
      # lost; skipped when nothing new was downloaded or cached.
      - name: Key of what is on disk now
        id: key
        if: always()
        run: |
          files=$(find data/bronze data/catalog_cache -type f 2>/dev/null | sort | sha256sum | cut -c1-16)
          manifest=$(sha256sum data/bronze/manifest.parquet 2>/dev/null | cut -c1-16)
          echo "key=bronze-${manifest:-none}-${files}" >> "$GITHUB_OUTPUT"
      - name: Save bronze and the catalog cache
        if: always() && steps.key.outputs.key != steps.restore.outputs.cache-matched-key
        uses: actions/cache/save@v4
        with:
          path: |
            data/bronze
            data/catalog_cache
          key: ${{ steps.key.outputs.key }}

      - name: Place gold next to the site
        run: mkdir -p web/gold && cp -a data/gold/. web/gold/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    # Pushes and the weekly run always deploy; a run by hand only if "deploy" is on.
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
