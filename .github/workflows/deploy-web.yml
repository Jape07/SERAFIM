name: deploy-web

# Publishes the site files without waiting for python -m serafim run.
# That pipeline can sit for a long time on catalog retries, and until it
# finishes GitHub Pages keeps the previous HTML. This job copies the gold
# already on the live site next to the current web/ and deploys that.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/workflows/mirror_live_gold.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as the deploy job of publish.yml: two deploys to Pages never overlap, and a
# web-only deploy never steps on a gold deploy that is in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas pyarrow
      - name: Copy the gold already published
        run: python .github/workflows/mirror_live_gold.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
