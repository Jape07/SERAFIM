name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id "ci" is the required check in the rules for main.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      # The site in a real browser (Chrome comes with ubuntu-latest), on simulated gold: the
      # viewer must load an image, keep every control app.js handles, and throw nothing.
      - name: Simulated gold for the site check
        run: python -m serafim mock --all-targets
      - name: Site check
        run: python tests/web/check_site.py --gold data/gold
