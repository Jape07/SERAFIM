[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "serafim"
version = "0.0.1"
description = "How SPHEREx images of the sky change over time: medallion pipeline + static viewer."
readme = "README.md"
requires-python = ">=3.11"
# Pinned versions so every laptop and GitHub Actions install exactly the same thing.
dependencies = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "astropy==8.0.2",
    "astroquery==0.4.11",
    "reproject==0.21.0",
    "sep==1.4.1",
    "duckdb==2.0.0",
    "matplotlib==3.11.2",
    "imageio==2.38.1",
    "onnxruntime==1.32.0",
    "pyyaml==6.0.3",
    "pyvo==1.10.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
# Everyone: tests and lint.
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
# AI & validation only: training, hyperparameter search and ONNX export.
# The pipeline itself never needs these (it runs the model with onnxruntime).
ai = [
    "torch==2.15.0",
    "optuna==5.0.0",
    "onnx==1.23.2",
    "scikit-learn==1.9.1",
]

[project.scripts]
serafim = "serafim.cli:main"

[tool.setuptools.packages.find]
include = ["serafim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so tests can import training/ (not an installed package) when run as `pytest`
pythonpath = ["."]
# Tests that query real services (SkyBoT, SIMBAD, Gaia) are skipped by default and in CI.
# Run them by hand with: pytest -m network
addopts = "-q -m 'not network'"
markers = ["network: queries real external services; run by hand with pytest -m network"]
