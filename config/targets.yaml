# SERAFIM: the 5 SPHEREx challenge targets and every pipeline setting.
# Edit the settings by hand. The target list below the marker line is generated:
#   python -m serafim.validation.targets
# Run it again instead of editing numbers; every number comes from a query you can repeat.

settings:
  cutout_size_deg: 0.25            # Side of each cutout; a target can set its own cutout_size_deg
  # At most this many frames per (season, detector), spread in time. D1 measured it: 874 frames,
  # ~3.8 GB for the 5 targets (docs/real_fits.md). EPSF stays in bronze.
  max_frames_per_season_detector: 12
  parallel_downloads: 8            # Be nice to IRSA: never more than 8 at once
  retries: 3                       # After the first try; it waits 5, 10 and 15 s
  # SIA collections in priority order: when an exposure is in several, the first one wins
  # (DR1 over QR3).
  collections: [spherex_dr1, spherex_dr1_deep, spherex_qr3, spherex_qr3_deep]
  seasons:
    gap_days: 30                   # A new season starts after more than 30 days without frames
    max_days: 183                  # Longer runs (near the poles) are cut into ~6-month passes
  validation:
    match_radius_px: 2             # 2 px ~ 12 arcsec (1 SPHEREx pixel = 6.15 arcsec)

